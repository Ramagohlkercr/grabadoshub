<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="16" fill="#F0EDE7"/>
  <!-- Dark acrylic base -->
  <rect x="120" y="210" width="160" height="25" rx="4" fill="#20201E" stroke="#0E0E0D" stroke-width="2"/>
  <rect x="135" y="195" width="130" height="15" rx="2" fill="#363633"/>
  <!-- Optical block -->
  <polygon points="150,45 250,45 265,195 135,195" fill="#FFFFFF" fill-opacity="0.8" stroke="#A8C5DA" stroke-width="2"/>
  <!-- Internal laser rasterized 3D bubble art -->
  <polygon points="200,80 215,115 185,115" fill="#A66B50" opacity="0.85"/>
  <circle cx="200" cy="130" r="14" fill="none" stroke="#20201E" stroke-width="2"/>
  <text x="200" y="165" font-family="sans-serif" font-size="11" font-weight="700" fill="#20201E" text-anchor="middle">EXCELENCIA 2026</text>
  <text x="200" y="275" font-family="sans-serif" font-size="12" font-weight="600" fill="#77756F" text-anchor="middle">TROFEO MONOLÍTICO • MICROBURBUJAS LÁSER</text>
</svg>
